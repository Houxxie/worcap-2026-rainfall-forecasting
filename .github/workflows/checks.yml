name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Repository and forecast contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-checks.txt
            research/prospective/requirements_verification.txt
      - name: Install CPU check environment
        run: python -m pip install -r requirements-checks.txt
      - name: Verify repository and synthetic forecast lifecycle
        run: python scripts/run_checks.py
